[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastnewton"
version = "0.1.0.dev0"
description = "GPU semismooth Newton projection onto the uniform transport polytope"
requires-python = ">=3.9"
dependencies = ["torch"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
